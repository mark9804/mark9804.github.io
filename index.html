<!DOCTYPE html>
<html>
  <head>
    <title>Redirecting...</title>
  </head>
  <body>
    <script>
      // Simple polifill for Promise.any
      if (!Promise.any) {
        Promise.any = (promises) => {
          return new Promise((resolve, reject) => {
            let count = 0;
            const len = promises.length;
            if (len === 0) reject(new Error("No promises"));

            promises.forEach((p) => {
              Promise.resolve(p)
                .then(resolve)
                .catch(() => {
                  count++;
                  if (count === len) reject(new Error("All promises rejected"));
                });
            });
          });
        };
      }

      const ping = (url, timeout = 3000) => {
        return new Promise((resolve, reject) => {
          const img = new Image();
          const timer = setTimeout(() => reject("timeout"), timeout);

          img.onload = () => {
            clearTimeout(timer);
            resolve(url);
          };

          img.onerror = () => {
            clearTimeout(timer);
            reject("error");
          };

          img.src = `${url}/heartbeat.png?v=${Date.now()}`;
        });
      };

      const available_endpoints = [
        "https://mark9804.netlify.app",
        "https://mark9804.github.io/blog",
        "https://mark9804.vercel.app",
      ];

      (async () => {
        try {
          const best = await Promise.any(
            available_endpoints.map((url) => ping(url))
          );
          window.location.href = best;
        } catch (e) { // all promises rejected
          window.location.href = available_endpoints[0];
        }
      })();
    </script>
    <div
      style="
        display: flex;
        flex-direction: column;
        width: 100vw;
        height: 100vh;
        justify-content: center;
        align-items: center;
        gap: 16px;
      "
    >
      <span>Wait a moment while we determine the best endpoint...</span>
      <a href="https://mark9804.netlify.app">Blog</a>
    </div>
  </body>
</html>
