<!doctype html>
<html>
  <head>
    <title>Redirecting...</title>
  </head>
  <body>
    <script>
      const ENDPOINTS = [
        "netlify.app",
        "github.io/blog",
        "vercel.app",
      ].map(e => "https://mark9804." + e);

      const ping = (url) =>
        new Promise((resolve, reject) => {
          const img = new Image();
          const timer = setTimeout(reject, 3000);
          img.onload = img.onerror = () => {
            clearTimeout(timer);
            img.naturalWidth ? resolve(url) : reject();
          };
          img.src = url + "/heartbeat.png?v=" + Date.now();
        });

      Promise.any(ENDPOINTS.map(ping))
        .catch(() => ENDPOINTS[0])
        .then((best) => {
          const path = location.pathname;
          // github.io serves under /blog, others serve at root
          const needsPrefix = best.includes("github.io");
          const normalizedPath = path.startsWith("/blog")
            ? needsPrefix
              ? path
              : path.slice(5)
            : needsPrefix
              ? "/blog" + path
              : path;
          location.href = best.replace(/\/blog$/, "") + normalizedPath;
        });
    </script>
    <div
      style="
        display: flex;
        flex-direction: column;
        width: 100vw;
        height: 100vh;
        justify-content: center;
        align-items: center;
        gap: 16px;
      "
    >
      <div>Redirecting to the fastest available mirror...</div>
      <div>
        If you are not being redirected,
        <a href="https://mark9804.netlify.app">click here</a>
      </div>
    </div>
  </body>
</html>
